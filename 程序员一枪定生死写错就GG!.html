    <style rel="stylesheet" crossorigin>:root{--bg: #05070f;--panel: rgba(6, 12, 26, .86);--green: #35f0b0;--cyan: #55d8ff;--orange: #ff8a3d;--red: #ff3b5c;--text: #d8f3ff;--dim: #7f9db8;--mono: Consolas, "JetBrains Mono", "Courier New", monospace}*{margin:0;padding:0;box-sizing:border-box}html,body{background:var(--bg);color:var(--text);font-family:var(--mono);overflow:hidden;height:100%}#app{display:flex;align-items:center;justify-content:center;height:100vh;background:radial-gradient(1200px 600px at 50% -10%,rgba(30,60,120,.25),transparent 60%),var(--bg)}#stage{position:relative;width:min(97vw,calc(97vh * 16 / 9));aspect-ratio:16 / 9;-webkit-user-select:none;user-select:none;box-shadow:0 0 60px #1450a040,0 0 0 1px #5ab4ff26;border-radius:8px;overflow:hidden}canvas{display:block;width:100%;height:100%;background:var(--bg);cursor:crosshair}.hidden{display:none!important}#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:linear-gradient(#040812d9,#04081200);z-index:5;pointer-events:none}.hud-left{display:flex;align-items:baseline;gap:12px}.hud-logo{font-weight:700;letter-spacing:2px;color:var(--green);text-shadow:0 0 8px rgba(53,240,176,.7);font-size:15px}.hud-combo{color:var(--orange);font-weight:700;font-size:13px;text-shadow:0 0 6px rgba(255,138,61,.7)}.hud-right{display:flex;gap:14px;align-items:center}.hud-item{font-size:13px;color:var(--dim)}.hud-item b{color:var(--text);font-size:15px}#hud-lives{font-size:15px;letter-spacing:2px}#hud-lives .on{color:var(--red);text-shadow:0 0 6px rgba(255,59,92,.8)}#hud-lives .off{color:#ffffff2e}#hud-ammo{color:var(--cyan)}#hint{position:absolute;bottom:0;left:0;right:0;text-align:center;padding:8px;font-size:12px;color:var(--dim);background:linear-gradient(#04081200,#040812d9);z-index:5;pointer-events:none}.overlay{position:absolute;top:0;right:0;bottom:0;left:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content   <body>
    <div id="app">
      <div id="stage">
        <canvas id="game" width="960" height="540"></canvas>

        <!-- 顶部 HUD -->
        <div id="hud" class="hidden">
          <div class="hud-left">
            <span class="hud-logo">BUG RUNNER</span>
            <span id="hud-combo" class="hud-combo"></span>
          </div>
          <div class="hud-right">
            <div class="hud-item">分数 <b id="hud-score">0</b></div>
            <div class="hud-item">时间 <b id="hud-time">0s</b></div>
            <div class="hud-item">墙 <b id="hud-walls">0</b></div>
            <div class="hud-item" id="hud-lives" aria-label="生命"></div>
            <div class="hud-item">弹药 <b id="hud-ammo">●</b></div>
          </div>
        </div>

        <!-- 底部操作提示 -->
        <div id="hint" class="hidden">
          移动鼠标瞄准 · 左键射击 · 每组墙只有一发子弹 · ESC 暂停
        </div>

        <!-- 开始菜单 -->
        <div id="menu" class="overlay">
          <h1 class="game-title">BUG RUNNER</h1>
          <p class="subtitle">程序员逃生 · 一枪定生死，写错就 GG！</p>
          <div class="howto">
            <p><b>移动鼠标</b> —— 左右移动，瞄准三条路线之一</p>
            <p><b>点击左键</b> —— 射击面前的玻璃墙（每组只有一发）</p>
            <p><b>打碎拼写正确的关键词</b> —— 才能继续前进</p>
            <p><b>射错 / 漏射 / 撞墙</b> —— 损失一条命，共三条命</p>
          </div>
          <div class="menu-buttons">
            <button id="btn-start" class="btn primary">▶ 开始游戏</button>
            <button id="btn-mute" class="btn">音效：开</button>
          </div>
          <p class="highscore">最高纪录：<b id="menu-high">0</b></p>
          <p class="tip">建议使用桌面浏览器 + 鼠标游玩</p>
        </div>

        <!-- 暂停 -->
        <div id="pause" class="overlay hidden">
          <h2 class="panel-title">已暂停</h2>
          <p class="tip">按 ESC 继续</p>
          <div class="menu-buttons">
            <button id="btn-resume" class="btn primary">▶ 继续游戏</button>
            <button id="btn-restart-p" class="btn">↻ 重新开始</button>
          </div>
        </div>

        <!-- 游戏结束 -->
        <div id="gameover" class="overlay hidden">
          <h2 class="panel-title danger">GAME OVER</h2>
          <p id="go-rank" class="rank"></p>
          <div class="stats">
            <div><span>最终得分</span><b id="go-score">0</b></div>
            <div><span>通过墙数</span><b id="go-walls">0</b></div>
            <div><span>存活时间</span><b id="go-time">0s</b></div>
            <div><span>正确率</span><b id="go-acc">--</b></div>
          </div>
          <p id="go-flavor" class="flavor"></p>
          <p id="go-record" class="record hidden">★ 新纪录！</p>
          <div class="menu-buttons">
            <button id="btn-restart" class="btn primary">↻ 再玩一次</button>
            <button id="btn-copy" class="btn">复制成绩</button>
            <button id="btn-home" class="btn">回到主菜单</button>
          </div>
          <p class="highscore">最高纪录：<b id="go-high">0</b></p>
        </div>

        <div id="toast" class="hidden"></div>
      </div>
    </div>
  </body>
</html>
